# nct6687d - modprobe options for the nct6687 kernel module
# (Nuvoton NCT6687 Super-I/O hardware monitoring)
#
# Uncomment and adjust as needed; `modinfo nct6687` lists all options:
#
#   # probe Nuvoton chips even with unrecognized vendor IDs
#   # options nct6687 force=1
#
#   # take voltage inputs/labels from an external sensors.d file
#   # options nct6687 manual=1
#
#   # brute-force fan curve writes (needed on some MSI boards)
#   # options nct6687 msi_fan_brute_force=1
#
# modprobe.d only accepts directives (options/alias/blacklist/...):
# a bare module name is ignored by libkmod with an ERROR log line.
